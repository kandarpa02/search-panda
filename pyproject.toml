[project]
name = "search-panda"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.118.0",

    "openai>=2.45.0,<3.0.0",
    "openai-agents>=0.9.0,<1.0.0",
    "pydantic>=2.12.2,<3.0.0",

    "ddgs",
    "httpx==0.28.1",

    "python-dotenv==1.1.1",
    "beautifulsoup4==4.13.4",
    "lxml==6.0.1",
    "tenacity==9.1.2",
    "loguru==0.7.3",

    "typer",
    "trafilatura",
    "rich",

    "uvicorn>=0.31.1",
    "python-multipart>=0.0.9"
]

[project.scripts]
search_panda = "search_panda.run:main"
search_panda_api = "search_panda.api:main"

[tool.pytest.ini_options]
pythonpath = ["."]